services:
  - type: web
    name: clinictrack-pro
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinictrack-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
  
  - type: psql
    name: clinictrack-db
    plan: free
    databaseName: clinictrack_pro
    user: clinic_user
